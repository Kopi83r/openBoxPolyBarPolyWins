conky.config = {
    alignment = 'top_right',
    background = true,
    border_width = 1,
    cpu_avg_samples = 2,
    default_color = 'white',
    default_outline_color = 'white',
    default_shade_color = 'white',
    double_buffer = true,
    draw_borders = false,
    draw_graph_borders = true,
    draw_outline = false,
    draw_shades = false,
    extra_newline = false,
    font = 'DejaVu Sans Mono:size=9',
    gap_x = 20,
    gap_y = 60,                        -- Clears your top Polybar on 1440x900
    minimum_height = 5,
    minimum_width = 260,
    net_avg_samples = 2,
    no_buffers = true,
    out_to_console = false,
    out_to_ncurses = false,
    out_to_stderr = false,
    out_to_x11 = true,
    own_window = true,
    own_window_class = 'Conky',
    own_window_type = 'desktop',
    own_window_transparent = true,
    own_window_argb_visual = true,
    own_window_hints = 'undecorated,below,sticky,skip_taskbar,skip_pager',
    show_graph_range = false,
    show_graph_scale = false,
    stippled_borders = 0,
    update_interval = 1.0,
    uppercase = false,
    use_spacer = 'none',
    use_xft = true,
    color1 = '55ffff', -- Cyan highlight color
}

conky.text = [[
${color1}SYSTEM ${hr 2}$color
Host:$alignr$nodename
Kernel:$alignr$kernel
Uptime:$alignr$uptime

${color1}MEMORY ${hr 2}$color
RAM Usage:$alignr$mem / $memmax ($memperc%)
RAM in MB:$alignr${top_mem mem_res 1} -- ${top_mem name 1}
$membar

${color1}TOP MEMORY PROCESSES ${hr 2}$color
${top_mem name 1}$alignr${top_mem mem_res 1} (${top_mem mem 1}%)
${top_mem name 2}$alignr${top_mem mem_res 2} (${top_mem mem 2}%)
${top_mem name 3}$alignr${top_mem mem_res 3} (${top_mem mem 3}%)

${color1}NETWORK (wlp3s0) ${hr 2}$color
Interface:$alignr wlp3s0
Local IP:$alignr${addr wlp3s0}
Down: ${downspeed wlp3s0}/s $alignr Up: ${upspeed wlp3s0}/s
${downspeedgraph wlp3s0 25,120} $alignr ${upspeedgraph wlp3s0 25,120}

${color1}OPENBOX SHORTCUTS ${hr 2}$color
${color1}Quick Launch Apps:$color
Alt + Enter $alignr Terminal
Alt + E $alignr File Manager
Ctrl + Alt + B $alignr Web Browser
Alt + Space $alignr Rofi Menu

${color1}Window Tiling (Snap):$color
Ctrl + Alt + Up $alignr Maximize (98% Span)
Ctrl + Alt + Left $alignr Left Tile (49%)
Ctrl + Alt + Right $alignr Right Tile (48%)
Win + F4 / KP_Right $alignr Right Half (50%)
Win + F2 / KP_Down $alignr Bottom Half (50%)
Win + F1 / KP_End $alignr Bottom-Left Corner
Win + F3 / KP_Next $alignr Bottom-Right Corner
Win + F9 / KP_Prior $alignr Top-Right Corner
Win + A + Home $alignr Top-Left Corner
Ctrl + Alt + M / Win + F5 $alignr Toggle Maximize

${color1}Desktops & Moving:$color
Win + Ctrl + Alt + Left $alignr Desktop Left
Win + Ctrl + Alt + Right $alignr Desktop Right
Alt + Shift + [1-4] $alignr Send Window to [1-4]
]]
