#################################
#  Picom configuration file (~/.config/picom.conf)
#  Based on old BunsenLabs/Compton setup
#  Updated for Picom (2025) — no deprecated options
#################################

#################################
#  Shadows
#################################
shadow = true;
no-dnd-shadow = true;
no-dock-shadow = true;
# clear-shadow is now always on — removed from config
shadow-radius = 17;
shadow-offset-x = -7;
shadow-offset-y = -7;
shadow-opacity = 0.9;

shadow-exclude = [
    "name = 'jgmenu'",
    "name = 'Notification'",
    "name = 'Plank'",
    "name = 'Docky'",
    "name = 'Kupfer'",
    "name *= 'VirtualBox'",
    "name *= 'VLC'",
    "name *= 'picom'",
    "name *= 'Chromium'",
    "name *= 'Chrome'",
    "class_g = 'Polybar'",
    "class_g ?= 'Conky'",
    "class_g = 'Kupfer'",
    "class_g = 'Synapse'",
    "class_g ?= 'Notify-osd'",
    "class_g ?= 'Cairo-dock'",
    "class_g ?= 'Xfce4-power-manager'",
    "_GTK_FRAME_EXTENTS@:c"
];
shadow-ignore-shaped = false;

#################################
#  Opacity
#################################
inactive-opacity = 1;
active-opacity = 1;
frame-opacity = 0.8;
inactive-opacity-override = false;
alpha-step = 0.06;

#blur-method = "dual_kawase";
#blur-strength = 6;
blur-kern = "3x3box";
blur-background-fixed = false;
blur-background-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@:c"
];

# Use wintypes for menu opacity (replaces deprecated menu-opacity)
wintypes:
{
  popup_menu   = { opacity = 1.0; };
  dropdown_menu = { opacity = 1.0; };
};

opacity-rule = [
    "40:class_g = 'Tk'"
];

#################################
#  Fading
#################################
fading = true;
fade-delta = 4;
fade-in-step = 0.03;
fade-out-step = 0.03;
fade-exclude = [ ];

#################################
#  Other behavior
#################################
mark-wmwin-focused = true;
mark-ovredir-focused = true;
use-ewmh-active-win = true;
detect-rounded-corners = true;
detect-client-opacity = true;
unredir-if-possible = true;
detect-transient = true;
detect-client-leader = true;

#################################
#  Backend and performance
#################################
# Choose backend automatically (or force glx if you prefer)
backend = "glx";

# Enable VSync for tear-free compositing
vsync = true;

# Avoid overdraws for fullscreen apps

# Paint on overlay for better performance
paint-on-overlay = true;

#################################
#  Rounded corners (new feature)
#################################
corner-radius = 10;
round-borders = 1;  # smooths edges a bit

rounded-corners-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'"
];

#################################
#  Notes
#  refresh-rate, clear-shadow, and menu-opacity are removed (deprecated)
#################################

