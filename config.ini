[colors]
background = #aa000000
background-alt = #373B41
foreground = #FFFFFFFF
primary = #FFFFFFFF
secondary = #8ABEB7
alert = #A54242
disabled = #707880

[bar/example]
width = 100%
height = 30pt
radius = 4
offset-y = 0
padding = 0

background = ${colors.background}
foreground = ${colors.foreground}

line-size = 3pt
border-size = 4pt
border-color = #00000000

padding-left = 0
padding-right = 1
module-margin = 1

separator = |
separator-foreground = ${colors.disabled}

# Added Font Awesome to fallback specifically for your layout/memory/network icons
font-0 = "JetBrainsMono Nerd Font:style=Bold:size=12;2"
font-1 = "Font Awesome 6 Free Solid:style=Solid:size=12;2"

# Removed broken eth-name module; using clean integrated eth layout instead
modules-left = xworkspaces polywins 
modules-right = filesystem memory cpu battery tray pulseaudio xkeyboard  date
modules-center = 

cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = true

[module/systray]
type = internal/tray
format-margin = 8pt
tray-spacing = 16pt

[module/xworkspaces]
type = internal/xworkspaces
enable-scroll = true         
pin-workspaces = true        

label-active = 
label-empty = 
label-occupied = 

label-active-padding = 1
label-empty-padding = 1
label-occupied-padding = 1

label-active-foreground = ${colors.primary}
label-urgent-foreground = ${colors.alert}
label-empty-foreground = ${colors.disabled}

format-margin = 1
label-padding = 1  

[module/xwindow]
type = internal/xwindow
label =  %title:0:60:...%

[module/filesystem]
type = internal/fs
interval = 25
mount-0 = /
label-mounted =  %mountpoint% %percentage_used%%
label-unmounted =  %mountpoint% not mounted
label-unmounted-foreground = ${colors.disabled}

[module/pulseaudio]
type = internal/pulseaudio
format-volume = <label-volume>
label-volume =  %percentage%%
label-volume-foreground = ${colors.foreground}
label-muted =  muted
label-muted-foreground = ${colors.disabled}

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
label-layout =  %layout%
label-layout-foreground = ${colors.primary}
label-indicator-padding = 2
label-indicator-margin = 1
label-indicator-foreground = ${colors.background}
label-indicator-background = ${colors.secondary}

[module/memory]
type = internal/memory
interval = 2
# Swapped out non-rendering  for a reliable memory icon token
label =  %percentage_used:2%%

[module/cpu]
type = internal/cpu
interval = 2
label = %{A1:~/.config/polybar/scripts/bye.sh:} %percentage:2%%%{A}

[module/battery]
type = internal/battery

; Updated to match your exact hardware path
;battery = BAT0/home/openbox/.

adapter = ADP1
full-at = 99
low-at = 15
poll-interval = 5

; Formatting when charging
format-charging = <label-charging>
label-charging =  %percentage%%
label-charging-foreground = #A3BE8C

; Formatting when discharging (on battery)
format-discharging = <label-discharging>
label-discharging =  %percentage%%
label-discharging-foreground = ${colors.foreground}

; Formatting when full
format-full = <label-full>
label-full =  %percentage%%
label-full-foreground = ${colors.foreground}

; Formatting when low
format-low = <label-low>
label-low =  %percentage%%!!
label-low-foreground = ${colors.alert}

[module/date]
type = internal/date
interval = 1
date =  %H:%M
date-alt =  %Y-%m-%d %H:%M:%S
label = %date%
label-foreground = ${colors.primary}

[module/tray]
type = internal/tray

[module/polywins]
type = custom/script
exec = ~/.config/polybar/scripts/polywins.sh 2>/dev/null
format = <label>
label = %output%
label-foreground = #FFFFFF
label-background = #aa000000
label-padding = 1
tail = true

[settings]
screenchange-reload = true
pseudo-transparency = true
